  <script>window.PROJECT={"appTitle":"План покращення ділянки обкатки танком","theme":"dark","fontSize":17,"markerSize":50,"markerColor":"#c9a14a","markerShape":"square","projectDescription":"Комплексна програма покращення навчальної ділянки: модернізація тренувальної інфраструктури, благоустрій та облаштування зон.","summaryEyebrow":"Зведена відомість","summaryHeading":"Перелік пропозицій","compareBeforeLabel":"ДО","compareAfterLabel":"ПІСЛЯ","comparePointLabel":"Пропозиція","schemaSector":"A-01","schemaStatus":"ПРОПОЗИЦІЯ","points":[{"id":1,"title":"Танкова колія","category":"Навчальні місця","x":65.6,"y":68,"description":"Зміна позиція танкової колії: Зміна позиції та розміру танкової колії дасть змогу проводити обкатку танком швидче та меншими групами військовослужбовців. Також більші радіуси поворотів збільшать час служби самої танкової колії та знизять ризики поломки техніки на крутих поворотах."},{"id":2,"title":"Встановлення контейнера","category":"Інфраструктура","x":53.2,"y":64.1,"description":"Встановлення контейрена для чергування відповідальної особи на ділянці"},{"id":3,"title":"Лазертаг","category":"Навчальні місця","x":48.5,"y":57.1,"description":"Організувати накриття для лекції, та побудувати настил для техніки лазертаг щоб забезпечити роботоспроможність точки в складних погодних умовах (доще\\сніго захист). На даний момент при погіршенні погодних умов точка перестає працювати, техніка складається а зайняття переходить в лекційний формат, що погіршує засвоюваність матеріалу."},{"id":4,"title":"Лазертаг (макет техніки)","category":"Навчальні місця","x":43.3,"y":91,"description":"Для забезпечення роботи точки лазертаг в погану погоду потрібно встановити маленький настил від дощу\\снігу для маркерів лазертаг над технікою."},{"id":5,"title":"Вивчення слабких місць","category":"Навчальні місця","x":30.6,"y":44.8,"description":"Побудова накриття для бронетехніки на точці вивчення слабких місць бронетехніки : створення маскувальної позиції для бронетехніки та тіньової зони для курсантів на час проведення точки. Це дозволить курсантам якісно засвоювати матеріал в літню пору року, а також створить визначену ділянку з забезпеченням маскування для техніки (час перебування техніки на відкритій місцевості зараз 5 год)."},{"id":6,"title":"FPV","category":"Навчальні місця","x":45.8,"y":17.5,"description":"Облаштування лекційної ділянки для точки протидії FPV дронам : дасть можливість проводити лекції для курсантів якісно, у визначеному місці. Також надає змогу організувати точку VR для протидії FPV дронам з стрілецької зброї. Якщо настил зробити доще\\сніго непроникним це забезпечить здатність цієї точки працювати навіть в негоду з залученням VR гарнітур (в данний момент відбувається забезпечення всіх підрозділів VR установками для протидії FPV дронам)"},{"id":7,"title":"Згорівша бронетехніка","category":"Інше","x":15.9,"y":18.7,"description":"Додання додаткового екземпляра згорівшої бронетехніки на смузі перешкод при проходженні точки протидії FPV (на ділянці присутня згорівший танк який можна використати для цього)"},{"id":8,"title":"Точка вивчення одноразових засобів ураження бронетехніки","category":"Навчальні місця","x":91.6,"y":56.8,"description":"На цій ділянці курсанти вивчають одноразові засоби ураження бронетехніки : для забезпечення якісного навчального процесу у літню пору року пропонується побудувати настил для організації лекційного зайняття."},{"id":9,"title":"Парковка","category":"Інфраструктура","x":91.5,"y":87,"description":"Змінити позицію та кількість столів для польової кухні на парковці"},{"id":10,"title":"Проповзання під бронетехнікою","category":"Навчальні місця","x":72.1,"y":43.6,"description":"Маскування бронетехніки та точці проповзання: для забезпечення маскування бронетехніки пропонується побудувати настил що буде маскувати бронетехніку під час зайняття (5 годин у відкритому полі)"}],"photos":{"1":{"before":"images/point-1-before.jpg","after":"images/point-1-after.png"},"2":{"before":"images/poi
